<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرر المعادلات العربية والخرائط الذهنية</title>
    <link href="https://fonts.googleapis.com/css?family=Amiri" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Load marked.js for Markdown parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <!-- Load html2pdf.js for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Load D3.js for Mind Maps -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <!-- Mind Map Styles -->
    <link rel="stylesheet" href="css/mindmap.css">

    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #333;
        }

        /* Layout */
        .main-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .toolbar {
            background-color: #2c3e50;
            color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            flex-wrap: wrap;
        }

        .toolbar h1 {
            margin: 0;
            font-size: 1.2rem;
            margin-left: auto;
        }

        .toolbar-btn {
            background-color: #34495e;
            border: 1px solid #46627f;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .toolbar-btn:hover {
            background-color: #46627f;
        }

        .toolbar-select {
            background-color: #34495e;
            color: white;
            border: 1px solid #46627f;
            padding: 6px;
            border-radius: 4px;
            font-family: inherit;
            cursor: pointer;
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #34495e;
            padding: 5px 10px;
            border-radius: 4px;
        }

        .app-container {
            display: flex;
            flex: 1;
            flex-direction: row;
            overflow: hidden;
        }

        .editor-pane, .preview-pane {
            flex: 1;
            height: 100%;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        .editor-pane {
            border-left: 1px solid #e0e0e0;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
        }

        .preview-pane {
            background-color: #ffffff;
            font-family: 'Amiri', serif;
            font-size: 18px;
            line-height: 1.6;
        }

        /* Editor Styling */
        textarea {
            width: 100%;
            height: 100%;
            border: none;
            resize: none;
            background-color: transparent;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 16px;
            outline: none;
            direction: ltr;
            text-align: left;
        }

        /* Preview Styling */
        .preview-content {
            max-width: 100%;
            margin: 0 auto;
        }

        /* Basic Markdown Styles */
        .preview-content:not(.mindmap-active) h1,
        .preview-content:not(.mindmap-active) h2,
        .preview-content:not(.mindmap-active) h3 {
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-top: 20px;
        }

        .preview-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 15px 0;
        }
        .preview-content th, .preview-content td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        .preview-content th {
            background-color: #f2f2f2;
        }

        .preview-content code {
            background-color: #f5f5f5;
            padding: 2px 5px;
            border-radius: 3px;
            font-family: monospace;
        }

        .preview-content pre {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            direction: ltr;
            text-align: left;
        }

        /* Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }

        /* --- MIND MAP CONTAINER --- */
        #mindmap-container {
            width: 100%;
            height: 100%;
            display: none; /* Hidden by default */
        }

        /* Hide preview text when mind map is active */
        .mindmap-mode #preview {
            display: none;
        }
        .mindmap-mode #mindmap-container {
            display: block;
        }

    </style>

    <script type="text/x-mathjax-config">
        MathJax.Ajax.config.path["arabic"] = "https://cdn.jsdelivr.net/gh/Edraak/arabic-mathjax@1.1/dist";
        MathJax.Hub.Config({
            extensions: ["[arabic]/arabic.js"],
            tex2jax: {
                inlineMath: [["$", "$"], ["\\(", "\\)"]],
                displayMath: [["$$", "$$"], ["\\[", "\\]"]],
                processEscapes: true,
                skipTags: ["script", "noscript", "style", "textarea", "pre", "code"]
            },
            "HTML-CSS": {
                undefinedFamily: "Amiri"
            }
        });
    </script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_HTMLorMML"></script>
    <!-- Mind Map Logic -->
    <script src="js/mindmap.js"></script>
</head>
<body>

<div class="main-wrapper">
    <div class="toolbar">
        <h1>محرر المعادلات والخرائط</h1>

        <div class="toggle-switch">
            <input type="checkbox" id="viewToggle">
            <label for="viewToggle">عرض كخريطة ذهنية</label>
        </div>

        <select id="layoutSelect" class="toolbar-select" onchange="updatePreview()">
            <option value="vertical">شجرية (عمودي)</option>
            <option value="horizontal">شجرية (أفقي)</option>
        </select>

        <button class="toolbar-btn" onclick="loadCode()">
            <i class="fas fa-upload"></i> استيراد
        </button>
        <button class="toolbar-btn" onclick="saveCode()">
            <i class="fas fa-save"></i> حفظ
        </button>
        <button class="toolbar-btn" onclick="exportPDF()">
            <i class="fas fa-file-pdf"></i> تحميل PDF
        </button>

        <!-- Hidden file input -->
        <input type="file" id="fileInput" style="display: none" accept=".md,.txt">
    </div>

    <div class="app-container">
        <div class="editor-pane">
            <textarea id="editor" placeholder="اكتب هنا... (يدعم Markdown و LaTeX)">
# الفيزياء (الجذر)

## الميكانيكا
:فرع يهتم بحركة الأجسام
- السرعة
  - $$ v = \frac{d}{t} $$
- التسارع
  - $$ a = \frac{v}{t} $$
- قوانين نيوتن
  - القانون الأول
  - القانون الثاني
    - $$ F = m \times a $$

## الكهرباء
:دراسة الشحنات
- قانون أوم
  - الجهد (V)
    - $$ V = I \times R $$
  - التيار (I)
  - المقاومة (R)

## جداول مقارنة
| الكمية | الوحدة | الرمز |
| :---: | :---: | :---: |
| الطول | متر | m |
| الكتلة | كيلوجرام | kg |
| الزمن | ثانية | s |

## نص توضيحي
يمكنك استخدام هذا المحرر لإنشاء خرائط ذهنية تفاعلية ومعادلات رياضية معقدة.
يدعم **Markdown** بشكل كامل.
            </textarea>
        </div>
        <div class="preview-pane">
            <div id="preview" class="preview-content"></div>
            <div id="mindmap-container" class="mindmap-container"></div>
        </div>
    </div>
</div>

<script>
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const mindmapContainer = document.getElementById('mindmap-container');
    const viewToggle = document.getElementById('viewToggle');
    const layoutSelect = document.getElementById('layoutSelect');
    const fileInput = document.getElementById('fileInput');
    const previewPane = document.querySelector('.preview-pane');

    let mindmap = null;

    // Configure marked.js
    marked.setOptions({
        gfm: true,
        breaks: true,
    });

    // Global update function
    window.updatePreview = function() {
        const rawMarkdown = editor.value;
        const isMindMap = viewToggle.checked;
        const layout = layoutSelect.value;

        if (isMindMap) {
            // Show Mind Map, Hide Text
            previewPane.classList.add('mindmap-mode');

            if (!mindmap) {
                mindmap = new MindMap('mindmap-container');
            }
            mindmap.render(rawMarkdown, layout);

        } else {
            // Show Text, Hide Mind Map
            previewPane.classList.remove('mindmap-mode');
            renderDoc(rawMarkdown);
        }
    };

    function renderDoc(markdown) {
        // 1. Pre-process math
        const mathExpressions = [];
        let protectedText = markdown.replace(/\$\$([\s\S]+?)\$\$/g, function(match) {
            mathExpressions.push(match);
            return "MATH_BLOCK_" + (mathExpressions.length - 1);
        });

        protectedText = protectedText.replace(/\$([^\$\n]+?)\$/g, function(match) {
             mathExpressions.push(match);
            return "MATH_INLINE_" + (mathExpressions.length - 1);
        });

        // 2. Render Markdown
        let html = marked.parse(protectedText);

        // 3. Restore math
        html = html.replace(/MATH_BLOCK_(\d+)/g, function(match, index) {
            return mathExpressions[parseInt(index)];
        });
        html = html.replace(/MATH_INLINE_(\d+)/g, function(match, index) {
            return mathExpressions[parseInt(index)];
        });

        preview.innerHTML = html;

        // 4. Render MathJax
        if (window.MathJax) {
            MathJax.Hub.Queue(["Typeset", MathJax.Hub, preview]);
        }
    }

    // Listen for changes
    editor.addEventListener('input', updatePreview);
    viewToggle.addEventListener('change', updatePreview);

    // Initial render
    // Wait a moment for scripts to load
    setTimeout(updatePreview, 500);

    // --- Toolbar Functions ---

    function loadCode() {
        fileInput.click();
    }

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            editor.value = e.target.result;
            updatePreview();
        };
        reader.readAsText(file);
        fileInput.value = '';
    });

    function saveCode() {
        const text = editor.value;
        const blob = new Blob([text], { type: 'text/markdown' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'mindmap.md';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function exportPDF() {
        // If mind map is active, export that? Or always export preview text?
        // html2pdf usually captures visible element.
        const element = document.querySelector('.preview-pane'); // Capture the whole pane

        const opt = {
            margin:       [10, 10, 10, 10],
            filename:     'document_export.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
        };

        html2pdf().set(opt).from(element).save();
    }

</script>

</body>
</html>
