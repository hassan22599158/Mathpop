<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرر المعادلات العربية</title>
    <link href="https://fonts.googleapis.com/css?family=Amiri" rel="stylesheet" type="text/css">
    <!-- Load marked.js for Markdown parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #333;
        }

        /* Layout */
        .app-container {
            display: flex;
            height: 100vh;
            flex-direction: row;
            overflow: hidden;
        }

        .editor-pane, .preview-pane {
            flex: 1;
            height: 100%;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }

        .editor-pane {
            border-left: 1px solid #e0e0e0;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
        }

        .preview-pane {
            background-color: #ffffff;
            font-family: 'Amiri', serif;
            font-size: 18px;
            line-height: 1.6;
        }

        /* Editor Styling */
        textarea {
            width: 100%;
            height: 100%;
            border: none;
            resize: none;
            background-color: transparent;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 16px;
            outline: none;
            direction: ltr;
            text-align: left;
        }

        /* Preview Styling */
        .preview-content {
            max-width: 1000px; /* Increased for mindmaps */
            margin: 0 auto;
        }

        .preview-content h1, .preview-content h2, .preview-content h3 {
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-top: 20px;
        }

        .preview-content code {
            background-color: #f5f5f5;
            padding: 2px 5px;
            border-radius: 3px;
            font-family: monospace;
        }

        .preview-content pre {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            direction: ltr;
            text-align: left;
        }

        .preview-content blockquote {
            border-right: 4px solid #ccc;
            margin: 0;
            padding-right: 15px;
            color: #666;
        }

        /* Table Styling */
        .preview-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 10px 0;
        }
        .preview-content table th, .preview-content table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        .preview-content table th {
            background-color: #f2f2f2;
        }

        /* Mindmap / CSS Tree Styles */
        .mindmap-container {
            overflow: auto;
            padding: 20px;
            background: #f4f4f4;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .tf-tree {
            display: flex;
            justify-content: center;
            direction: ltr; /* Force LTR layout logic for trees to ensure lines connect correctly, content can still be RTL */
        }

        /* Restore RTL for content inside tree */
        .tf-tree .tf-nc {
            direction: rtl;
            text-align: right;
        }

        .tf-tree ul {
            display: flex;
            padding-top: 20px;
            position: relative;
            padding-left: 0;
            margin: 0;
        }

        .tf-tree li {
            list-style-type: none;
            position: relative;
            padding: 20px 5px 0 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Connecting lines */
        .tf-tree li::before, .tf-tree li::after {
            content: '';
            position: absolute;
            top: 0;
            right: 50%;
            border-top: 2px solid #ccc;
            width: 50%;
            height: 20px;
        }

        .tf-tree li::after {
            right: auto;
            left: 50%;
            border-left: 2px solid #ccc;
        }

        .tf-tree li:only-child::after, .tf-tree li:only-child::before {
            display: none;
        }
        .tf-tree li:only-child {
            padding-top: 0;
        }

        .tf-tree li:first-child::before {
            border: 0 none;
        }
        .tf-tree li:last-child::after {
            border: 0 none;
        }

        .tf-tree li:last-child::before {
            border-right: 2px solid #ccc;
            border-radius: 0 5px 0 0;
        }
        .tf-tree li:first-child::after {
            border-radius: 5px 0 0 0;
        }

        .tf-tree ul ul::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            border-left: 2px solid #ccc;
            width: 0;
            height: 20px;
        }

        .tf-nc {
            border: 1px solid #ccc;
            padding: 10px;
            text-decoration: none;
            color: #333;
            background: #fff;
            display: inline-block;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            min-width: 150px;
            max-width: 300px; /* Adjust as needed */
            position: relative;
            z-index: 1;
        }

        .tf-nc h1, .tf-nc h2, .tf-nc h3, .tf-nc h4, .tf-nc h5 {
            margin-top: 0;
            font-size: 1.2em;
            border-bottom: 1px solid #eee;
        }

        /* Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }

    </style>

    <script type="text/x-mathjax-config">
        MathJax.Ajax.config.path["arabic"] = "https://cdn.jsdelivr.net/gh/Edraak/arabic-mathjax@1.1/dist";
        MathJax.Hub.Config({
            extensions: ["[arabic]/arabic.js"],
            tex2jax: {
                inlineMath: [["$", "$"], ["\\(", "\\)"]],
                displayMath: [["$$", "$$"], ["\\[", "\\]"]],
                processEscapes: true,
                skipTags: ["script", "noscript", "style", "textarea", "pre", "code"]
            },
            "HTML-CSS": {
                undefinedFamily: "Amiri"
            }
        });
    </script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_HTMLorMML"></script>
</head>
<body>

<div class="app-container">
    <div class="editor-pane">
        <textarea id="editor" placeholder="اكتب هنا... (يدعم Markdown و LaTeX)

```mindmap
- **العنوان الرئيسي**
  شرح مبسط
  $$ x^2 $$
  - **فرع 1**
    محتوى
  - **فرع 2**
    | A | B |
    |---|---|
    | 1 | 2 |
```
"></textarea>
    </div>
    <div class="preview-pane">
        <div id="preview" class="preview-content"></div>
    </div>
</div>

<script>
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');

    // Configure marked.js
    marked.setOptions({
        gfm: true,
        breaks: true,
    });

    // Mind Map Parser Logic
    function parseMindMap(input) {
        const lines = input.split('\n').filter(l => l.trim().length > 0);
        if (lines.length === 0) return '';

        const root = { children: [], level: -1 };
        const stack = [root];

        lines.forEach(line => {
            // Detect indentation: assume 2 spaces per level
            const match = line.match(/^(\s*)/);
            const indent = match ? match[1].length : 0;
            const level = Math.floor(indent / 2);

            let content = line.trim();

            // Determine if it's a new node header (starts with - or *)
            if (content.startsWith('- ') || content.startsWith('* ')) {
                content = content.substring(2); // Remove bullet
                const newNode = {
                    content: content,
                    body: "",
                    children: [],
                    level: level
                };

                // Adjust stack to find correct parent
                while (stack.length > level + 1) {
                    stack.pop();
                }

                // Fallback if indentation is skipped (though logic tries to handle strict tree)
                // Ideally parent is stack[stack.length -1]
                if (stack.length === 0) stack.push(root); // Should not happen with level -1 root

                const parent = stack[stack.length - 1];
                parent.children.push(newNode);
                stack.push(newNode);

            } else {
                // It is body content for the current node
                const currentNode = stack[stack.length - 1];
                if (currentNode !== root) {
                    currentNode.body += "\n" + content;
                }
            }
        });

        function renderNode(node) {
            let html = '<li>';
            html += '<div class="tf-nc">';

            // Construct the Markdown content for the node
            // Header is usually bold or h3
            let fullText = "";
            if(node.content) fullText += "#### " + node.content + "\n";
            if(node.body) fullText += node.body;

            // Use marked to render the inner content of the card
            // Note: MathJax placeholders are already present in the text if we do this after protection
            html += marked.parse(fullText);

            html += '</div>';

            if (node.children.length > 0) {
                html += '<ul>';
                node.children.forEach(child => {
                    html += renderNode(child);
                });
                html += '</ul>';
            }

            html += '</li>';
            return html;
        }

        let output = '<div class="mindmap-container"><div class="tf-tree"><ul>';
        // If root has children, render them. If user started with indentation 0, they are children of our virtual root.
        root.children.forEach(child => {
            output += renderNode(child);
        });
        output += '</ul></div></div>';

        return output;
    }

    function updatePreview() {
        const rawMarkdown = editor.value;

        // 1. Pre-process math to prevent marked from messing it up.
        // We will replace $$...$$ and $...$ with placeholders.

        const mathExpressions = [];
        let protectedText = rawMarkdown.replace(/\$\$([\s\S]+?)\$\$/g, function(match) {
            mathExpressions.push(match);
            return "MATH_BLOCK_" + (mathExpressions.length - 1);
        });

        protectedText = protectedText.replace(/\$([^\$\n]+?)\$/g, function(match) {
             mathExpressions.push(match);
            return "MATH_INLINE_" + (mathExpressions.length - 1);
        });

        // 2. Detect and parse custom blocks (Mind Map)
        // Look for ```mindmap ... ```

        protectedText = protectedText.replace(/```mindmap([\s\S]*?)```/g, function(match, content) {
            return parseMindMap(content);
        });

        // 3. Render standard Markdown for the rest
        let html = marked.parse(protectedText);

        // 4. Restore math
        // We need to restore math in the entire HTML result (including inside mindmaps)
        // Loop until no more replacements to be safe, or just one pass if indices are unique.

        html = html.replace(/MATH_BLOCK_(\d+)/g, function(match, index) {
            return mathExpressions[parseInt(index)];
        });
        html = html.replace(/MATH_INLINE_(\d+)/g, function(match, index) {
            return mathExpressions[parseInt(index)];
        });

        preview.innerHTML = html;

        // 5. Render MathJax
        MathJax.Hub.Queue(["Typeset", MathJax.Hub, preview]);
    }

    // Listen for changes
    editor.addEventListener('input', updatePreview);

    // Initial render
    // Set default text if empty
    if (!editor.value) {
        editor.value = `# خريطة ذهنية

\`\`\`mindmap
- **الجذر الرئيسي**
  شرح للموضوع
  $$ x^2 + y^2 = z^2 $$
  - **فرع يمين**
    محتوى نصي
    | أ | ب |
    |---|---|
    | 1 | 2 |
  - **فرع يسار**
    معادلة أخرى
    $$ \\frac{1}{x} $$
\`\`\`
`;
    }
    updatePreview();
</script>

</body>
</html>
